# Local executable container stack; production uses independent credentials and HTTPS origins.
services:
  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    image: junta-api:local
    init: true
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://junta:${POSTGRES_PASSWORD:-junta_local}@postgres:5432/junta?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Run node scripts/setup-env.mjs}
      CORS_ORIGINS: ${CORS_ORIGINS}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      PUSH_ENABLED: 'false'
      ENABLE_API_DOCS: 'true'
    ports: ['127.0.0.1:4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  worker:
    image: junta-api:local
    init: true
    command: ['node', 'dist/worker.js']
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://junta:${POSTGRES_PASSWORD:-junta_local}@postgres:5432/junta?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Run node scripts/setup-env.mjs}
      PUSH_ENABLED: 'false'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
